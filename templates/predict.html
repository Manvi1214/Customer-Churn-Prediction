{% extends 'layout.html' %}

{% block title %}Predict Churn - Input Customer Details{% endblock %}

{% block content %}
<section class="form-container">
    <h1 class="form-title">Analyze Customer Churn Risk</h1>
    
    <form action="{{ url_for('predict') }}" method="POST">
        <div class="form-grid">
            
            <!-- Group 1: Age -->
            <div class="form-group">
                <label for="Age" class="form-label">Age (Years)</label>
                <input type="number" id="Age" name="Age" class="form-control" min="18" max="100" placeholder="e.g. 35" required value="30">
            </div>
            
            <!-- Group 2: Gender -->
            <div class="form-group">
                <label for="Gender" class="form-label">Gender</label>
                <select id="Gender" name="Gender" class="form-control" required>
                    <option value="" disabled>Select Gender</option>
                    <option value="Female" selected>Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>
            
            <!-- Group 3: Tenure -->
            <div class="form-group">
                <label for="Tenure" class="form-label">Tenure (Months)</label>
                <input type="number" id="Tenure" name="Tenure" class="form-control" min="0" max="120" placeholder="e.g. 24" required value="12">
            </div>
            
            <!-- Group 4: Usage Frequency -->
            <div class="form-group">
                <label for="Usage Frequency" class="form-label">Usage Frequency (Sessions/Month)</label>
                <input type="number" id="Usage Frequency" name="Usage Frequency" class="form-control" min="0" max="100" placeholder="e.g. 15" required value="10">
            </div>
            
            <!-- Group 5: Support Calls -->
            <div class="form-group">
                <label for="Support Calls" class="form-label">Support Calls (Past Month)</label>
                <input type="number" id="Support Calls" name="Support Calls" class="form-control" min="0" max="20" placeholder="e.g. 2" required value="2">
            </div>
            
            <!-- Group 6: Payment Delay -->
            <div class="form-group">
                <label for="Payment Delay" class="form-label">Payment Delay (Days)</label>
                <input type="number" id="Payment Delay" name="Payment Delay" class="form-control" min="0" max="60" placeholder="e.g. 4" required value="5">
            </div>
            
            <!-- Group 7: Subscription Type -->
            <div class="form-group">
                <label for="Subscription Type" class="form-label">Subscription Type</label>
                <select id="Subscription Type" name="Subscription Type" class="form-control" required>
                    <option value="" disabled>Select Subscription</option>
                    <option value="Basic" selected>Basic</option>
                    <option value="Standard">Standard</option>
                    <option value="Premium">Premium</option>
                </select>
            </div>
            
            <!-- Group 8: Contract Length -->
            <div class="form-group">
                <label for="Contract Length" class="form-label">Contract Length</label>
                <select id="Contract Length" name="Contract Length" class="form-control" required>
                    <option value="" disabled>Select Contract</option>
                    <option value="Monthly" selected>Monthly</option>
                    <option value="Quarterly">Quarterly</option>
                    <option value="Annual">Annual</option>
                </select>
            </div>
            
            <!-- Group 9: Total Spend -->
            <div class="form-group">
                <label for="Total Spend" class="form-label">Total Spend ($)</label>
                <input type="number" id="Total Spend" name="Total Spend" class="form-control" min="0" max="100000" step="0.01" placeholder="e.g. 450.00" required value="300">
            </div>
            
            <!-- Group 10: Last Interaction -->
            <div class="form-group">
                <label for="Last Interaction" class="form-label">Last Interaction (Days Ago)</label>
                <input type="number" id="Last Interaction" name="Last Interaction" class="form-control" min="0" max="30" placeholder="e.g. 7" required value="10">
            </div>
            
        </div>
        
        <div style="text-align: center;">
            <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 300px;">🔍 Run Predictive Analysis</button>
        </div>
    </form>
</section>
{% endblock %}
